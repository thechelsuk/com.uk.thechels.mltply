name: Run Unit Tests

on:
    pull_request:
        branches: main
    workflow_dispatch:

permissions:
    contents: read
    checks: write

jobs:
    test:
        runs-on: macos-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest

            - name: Install dependencies
              run: |
                  brew install xcbeautify || true

            # Pick an installed iPhone simulator, since the runner's Xcode decides which exist.
            - name: Pick a simulator
              id: sim
              run: |
                  UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
                  echo "Using simulator $UDID"
                  echo "udid=$UDID" >> "$GITHUB_OUTPUT"

            - name: Build
              run: |
                  xcodebuild build -project Mltply.xcodeproj -scheme MltplyUnitTests -destination "id=${{ steps.sim.outputs.udid }}"

            - name: Run tests
              run: |
                  xcodebuild test -project Mltply.xcodeproj -scheme MltplyUnitTests -destination "id=${{ steps.sim.outputs.udid }}" -resultBundlePath TestResults | xcbeautify

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                name: TestResults
                path: TestResults

            - name: Annotate PR with test failures
              if: failure()
              uses: mikepenz/action-junit-report@v6
              with:
                report_paths: 'TestResults/**/*.xcresult/TestSummaries.plist'
                github_token: ${{ secrets.GITHUB_TOKEN }}
